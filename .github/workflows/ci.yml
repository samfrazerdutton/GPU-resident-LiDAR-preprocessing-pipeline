name: build-and-test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.16
        with:
          cuda: '12.6.0'
          method: 'network'
          sub-packages: '["nvcc", "cudart-dev"]'

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(nproc)

      # GitHub runners have no GPU. Device tests skip themselves; the CPU
      # reference tests still run, which is what guards the kernels' ground truth.
      - name: Test
        run: ctest --test-dir build --output-on-failure
